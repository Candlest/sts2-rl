# Kaiwu-style single-machine cluster: 1 learner + 1 actor + N aisrv pods + modelpool.
#
#   docker compose -f docker/compose.yaml up --build
#   docker compose -f docker/compose.yaml up --scale aisrv=8
#
# Every container is headless: the only game logic is the 2.7MB NativeAOT
# engine loaded in-process by each Python worker.

services:
  modelpool:
    image: sts2-rl:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: modelpool
      MODELPOOL_PORT: 10014
      MODEL_DIR: /data
    volumes:
      - modelpool-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  learner:
    image: sts2-rl:latest
    environment:
      ROLE: learner
      LEARNER_SAMPLE_PORT: 9998
      TORCH_THREADS: 4
      BATCH_SIZE: 16384
      MINIBATCH_SIZE: 4096
    depends_on:
      - modelpool
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  actor:
    image: sts2-rl:latest
    environment:
      ROLE: actor
      ACTOR_PORT: 8888
      TORCH_THREADS: 2
    depends_on:
      - modelpool
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  aisrv:
    image: sts2-rl:latest
    environment:
      ROLE: aisrv
      ENV_SLOTS: 4
      ENV_KIND: run
    depends_on:
      - actor
      - learner
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

volumes:
  modelpool-data:

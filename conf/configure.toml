# kaiwu_sts2 configuration — mirrors conf/kaiwudrl/configure.toml.
# Every key can be overridden by an environment variable of the same name
# (containers are configured through compose `environment:` blocks).
# Roles and ports follow kaiwudrl conventions where applicable.

[ports]
MODELPOOL_PORT = 10014        # kaiwu modelpool default
LEARNER_SAMPLE_PORT = 9998    # kaiwu on-policy zmq PUSH port (reverb_svr_port - 1)
ACTOR_PORT = 8888             # kaiwu aisrv->actor zmq port
ENV_PORT = 5566               # kaiwu kaiwu_env zmq port

[env]
ENV_KIND = "run"              # "run" (full run) | "combat" (single combat)
ENV_SLOTS = 8                 # parallel envs per aisrv pod
BASE_SEED = 100000

[model]
HIDDEN_SIZE = 256

[train]
BATCH_SIZE = 16384
MINIBATCH_SIZE = 4096
EPOCHS = 4
LR = 0.0003
GAMMA = 0.99
GAE_LAMBDA = 0.95
CLIP_RANGE = 0.2
ENT_COEF = 0.01
VF_COEF = 0.5
MAX_GRAD_NORM = 0.5
TORCH_THREADS = 4

[sync]
MODEL_SYNC_INTERVAL_S = 30
